name: Build PobarOS IMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Raspberry Pi 4 image
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout PobarOS
        uses: actions/checkout@v4

      - name: Checkout rpi-image-gen
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/rpi-image-gen
          ref: v2.7.0
          path: rpi-image-gen

      - name: Install rpi-image-gen dependencies
        working-directory: rpi-image-gen
        run: |
          sudo ./install_deps.sh

      - name: Build PobarOS
        run: |
          sudo ./rpi-image-gen/rpi-image-gen build \
            -S "$GITHUB_WORKSPACE" \
            -c "$GITHUB_WORKSPACE/config/pobar.yaml"

      - name: Find generated images
        run: |
          echo "Generated image files:"
          sudo find rpi-image-gen/work -type f \( -name '*.img' -o -name '*.img.xz' \) -print

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          IMG="$(sudo find rpi-image-gen/work -type f -name '*.img' | head -n 1)"
          if [ -z "$IMG" ]; then
            echo "No .img was generated."
            sudo find rpi-image-gen/work -maxdepth 5 -type f | head -200
            exit 1
          fi
          sudo cp "$IMG" artifact/PobarOS-TV.img
          sudo chown "$USER:$USER" artifact/PobarOS-TV.img
          sha256sum artifact/PobarOS-TV.img > artifact/SHA256SUMS.txt

      - name: Upload PobarOS IMG
        uses: actions/upload-artifact@v4
        with:
          name: PobarOS-TV
          path: artifact/
          if-no-files-found: error
