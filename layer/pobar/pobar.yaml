# METABEGIN
# X-Env-Layer-Name: pobar-os
# X-Env-Layer-Version: 0.5.0
# X-Env-Layer-Category: application
# X-Env-Layer-Desc: PobarOS fullscreen Tamagotchi application
# X-Env-Layer-Requires: debian-trixie-arm64-multi-minbase
# METAEND
---
mmdebstrap:
  packages:
    - python3
    - python3-pygame
    - alsa-utils
  customize-hooks:
    - |
      set -eu
      install -d "$1/opt/pobar" "$1/var/lib/pobar"
      install -m 0755 "${@SRCROOT}/app/main.py" "$1/opt/pobar/main.py"
      if ! chroot "$1" id pobar >/dev/null 2>&1; then
        chroot "$1" useradd --system --create-home --home-dir /var/lib/pobar --shell /usr/sbin/nologin pobar
      fi
      for g in video render input audio; do
        if chroot "$1" getent group "$g" >/dev/null 2>&1; then
          chroot "$1" usermod -a -G "$g" pobar || true
        fi
      done
      cat > "$1/etc/systemd/system/pobar.service" <<'EOF'
      [Unit]
      Description=PobarOS Tamagotchi
      After=network-online.target plymouth-quit.service
      Wants=network-online.target
      Conflicts=getty@tty1.service

      [Service]
      Type=simple
      User=pobar
      Group=pobar
      SupplementaryGroups=video render input audio
      WorkingDirectory=/opt/pobar
      Environment=SDL_VIDEODRIVER=kmsdrm
      Environment=SDL_AUDIODRIVER=alsa
      Environment=PYGAME_HIDE_SUPPORT_PROMPT=1
      ExecStart=/usr/bin/python3 /opt/pobar/main.py
      Restart=always
      RestartSec=2
      TTYPath=/dev/tty1
      StandardInput=tty
      StandardOutput=journal
      StandardError=journal

      [Install]
      WantedBy=multi-user.target
      EOF
      chroot "$1" systemctl enable pobar.service
